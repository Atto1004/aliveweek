<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#3f51b5">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>AliVEWEEK</title>
<style>
  :root {
    color-scheme: light dark;
    --bg:#f4f5f7; --panel:#fff; --line:#e3e5e9; --line2:#eef0f3; --fg:#1c1e21; --mute:#8a8f98; --accent:#3f51b5; --now:#e53935;
    --hour:52px; --gutter:46px; --col:124px;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#15171a; --panel:#1d1f23; --line:#2b2e33; --line2:#24272c; --fg:#e7e9ea; --mute:#8a8f98; --now:#ff5252; }
  }
  * { box-sizing:border-box; }
  html, body { height:100%; }
  body { margin:0; font-family:-apple-system, BlinkMacSystemFont, "Segoe UI", "Malgun Gothic", sans-serif; background:var(--bg); color:var(--fg); display:flex; flex-direction:column; overflow:hidden; }

  header.top { display:flex; flex-wrap:wrap; gap:6px 10px; align-items:center; justify-content:space-between; padding:10px 14px; background:var(--panel); border-bottom:1px solid var(--line); flex:none; }
  header.top h1 { font-size:15px; margin:0; font-weight:600; }
  header.top h1 small { color:var(--mute); font-weight:400; margin-left:6px; font-size:12px; }
  .nav { display:flex; gap:6px; }
  .nav a, .btn { text-decoration:none; color:inherit; padding:5px 10px; border:1px solid var(--line); border-radius:6px; font-size:13px; background:transparent; cursor:pointer; font-family:inherit; }
  .btn.primary { background:var(--accent); color:#fff; border-color:var(--accent); }
  .btn.on { background:color-mix(in srgb, var(--accent) 14%, transparent); border-color:var(--accent); color:var(--accent); }
  .banner { padding:6px 14px; font-size:12px; background:#fff3e0; color:#7a4a00; border-bottom:1px solid #ffe0b2; flex:none; display:flex; gap:10px; align-items:center; }
  @media (prefers-color-scheme: dark) { .banner { background:#3a2a10; color:#ffd699; border-color:#5a4020; } }

  /* ── 24시간 주간 그리드 ── */
  .sched { flex:1; overflow:auto; position:relative; }
  .grid { display:grid; grid-template-columns: var(--gutter) repeat(7, minmax(var(--col), 1fr)); min-width:100%; }
  .corner, .dayhead { position:sticky; top:0; z-index:5; background:var(--panel); border-bottom:1px solid var(--line); }
  .corner { left:0; z-index:7; }
  .dayhead { padding:6px 4px 4px; text-align:center; font-size:12px; color:var(--mute); border-left:1px solid var(--line2); }
  .dayhead b { display:block; font-size:17px; font-weight:600; color:var(--fg); line-height:1.2; }
  .dayhead.today b { color:var(--accent); }
  .dayhead.today b span { background:var(--accent); color:#fff; border-radius:999px; padding:0 8px; }
  .alllabel, .allday { position:sticky; top:48px; z-index:4; background:var(--panel); border-bottom:1px solid var(--line); min-height:26px; }
  .alllabel { left:0; z-index:6; font-size:10px; color:var(--mute); text-align:right; padding:6px 4px 0 0; }
  .allday { border-left:1px solid var(--line2); padding:3px 2px; display:flex; flex-direction:column; gap:2px; }
  .allday .pill { font-size:11px; padding:2px 6px; border-radius:4px; background:var(--c); color:#fff; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .gutter { position:sticky; left:0; z-index:3; background:var(--bg); height:calc(var(--hour) * 24); font-size:10px; color:var(--mute); font-variant-numeric:tabular-nums; }
  .gutter div { height:var(--hour); text-align:right; padding-right:5px; transform:translateY(-6px); }
  .daycol { position:relative; height:calc(var(--hour) * 24); border-left:1px solid var(--line2);
    background-image: repeating-linear-gradient(to bottom, var(--line) 0 1px, transparent 1px var(--hour)); }
  .daycol.today { background-color: color-mix(in srgb, var(--accent) 5%, transparent); }
  .daycol.past-day { opacity:.7; }

  .ev { position:absolute; border-radius:4px; padding:3px 5px; font-size:11px; line-height:1.25; overflow:hidden;
    background:color-mix(in srgb, var(--c) 18%, var(--panel)); border-left:3px solid var(--c); color:var(--fg); }
  .ev .t { font-weight:600; font-variant-numeric:tabular-nums; font-size:10px; color:var(--c); filter:brightness(.85); }
  @media (prefers-color-scheme: dark) { .ev .t { filter:brightness(1.3); } }
  .ev .n { font-weight:500; white-space:normal; overflow-wrap:anywhere; word-break:keep-all; line-height:1.2; }
  .ev .l { color:var(--mute); font-size:10px; white-space:normal; overflow-wrap:anywhere; line-height:1.2; }
  .ev.past { opacity:.45; }
  .ev.live { box-shadow:0 0 0 2px var(--c); background:color-mix(in srgb, var(--c) 30%, var(--panel)); }
  /* 짧은 일정(이동 등): 시각 줄 생략, 제목만 2줄까지 — 최소 높이는 30분 자리로 보장(layout에서 겹침 회피) */
  .ev.short { padding:0 4px; display:flex; align-items:center; background:color-mix(in srgb, var(--c) 22%, var(--panel)); box-shadow:0 1px 3px rgba(0,0,0,.18); }
  .ev.short .t { display:none; }
  .ev.short .n { font-size:10px; line-height:1.15; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }

  /* 장소 레이어 — 일정 뒤에 깔리는 빗금 띠 */
  .place { position:absolute; left:0; right:0; z-index:0; pointer-events:none; border:1px dashed color-mix(in srgb, var(--mute) 60%, transparent); border-radius:3px;
    background:repeating-linear-gradient(135deg, color-mix(in srgb, var(--mute) 14%, transparent) 0 4px, transparent 4px 10px); }
  .place span { pointer-events:auto; cursor:pointer; position:absolute; right:3px; top:1px; font-size:9px; padding:0 3px; border-radius:3px; background:var(--panel); color:var(--mute); white-space:nowrap; max-width:calc(100% - 6px); overflow:hidden; text-overflow:ellipsis; }
  .ev { z-index:1; }
  .sheet .days { display:flex; gap:4px; margin:4px 0; }
  .sheet .days label { flex:1; text-align:center; font-size:12px; padding:5px 0; border:1px solid var(--line); border-radius:6px; cursor:pointer; }
  .sheet .days input { display:none; }
  .sheet .days input:checked + span { color:#fff; }
  .sheet .days label:has(input:checked) { background:var(--accent); border-color:var(--accent); color:#fff; }

  .nowline { position:absolute; left:0; right:0; height:2px; background:var(--now); z-index:2; pointer-events:none; }
  .nowline::before { content:""; position:absolute; left:-5px; top:-4px; width:10px; height:10px; border-radius:50%; background:var(--now); }
  .nowtag { position:absolute; right:3px; font-size:10px; color:#fff; background:var(--now); border-radius:3px; padding:0 4px; z-index:4; transform:translateY(-50%); font-variant-numeric:tabular-nums; }

  /* ── 일정 상세 시트 ── */
  .ev, .allday .pill { cursor:pointer; }
  .backdrop { position:fixed; inset:0; background:rgba(0,0,0,.35); z-index:20; }
  .sheet { position:fixed; z-index:21; background:var(--panel); color:var(--fg); box-shadow:0 -4px 24px rgba(0,0,0,.2); border-radius:14px 14px 0 0;
    left:0; right:0; bottom:0; max-height:80vh; overflow:auto; padding:14px 18px calc(18px + env(safe-area-inset-bottom)); font-size:14px; line-height:1.5; }
  @media (min-width:700px) { .sheet { left:auto; right:16px; bottom:16px; width:380px; border-radius:14px; max-height:70vh; } }
  .sheet .bar { width:36px; height:4px; border-radius:2px; background:var(--line); margin:0 auto 10px; }
  @media (min-width:700px) { .sheet .bar { display:none; } }
  .sheet h2 { font-size:17px; margin:0 0 6px; padding-left:12px; border-left:5px solid var(--c); line-height:1.3; text-wrap:balance; }
  .sheet .cat { display:inline-block; font-size:11px; padding:1px 8px; border-radius:10px; background:var(--c); color:#fff; margin-right:6px; }
  .sheet .cal { font-size:11px; color:var(--mute); }
  .sheet dl { display:grid; grid-template-columns:52px 1fr; gap:6px 10px; margin:12px 0 0; }
  .sheet dt { color:var(--mute); font-size:12px; padding-top:1px; }
  .sheet dd { margin:0; overflow-wrap:anywhere; }
  .sheet dd.desc { white-space:pre-wrap; font-size:13px; }
  .sheet a { color:var(--accent); }
  .sheet .foot { display:flex; gap:8px; margin-top:14px; }
  .sheet .foot a, .sheet .foot button { flex:1; text-align:center; }
  .btn.danger { color:#d50000; border-color:#d50000; }
  .btn:disabled { opacity:.5; cursor:default; }
  .sheet .state { font-size:12px; color:var(--mute); margin-left:6px; }

  .sheet.add input:not([type=checkbox]), .sheet.add select, .sheet.add textarea { width:100%; padding:8px; font-size:14px; border:1px solid var(--line); border-radius:6px; font-family:inherit; background:transparent; color:inherit; margin:4px 0; }
  .sheet.add .row { display:flex; gap:8px; align-items:center; }
  .sheet.add .row input[type=time] { flex:1; }
  .sheet.add .chk { white-space:nowrap; font-size:13px; display:flex; gap:4px; align-items:center; }
  .sheet.add .hint { font-size:11px; color:var(--mute); margin:6px 0 0; }
  .sheet.add input:disabled { opacity:.4; }

  .panel { max-width:520px; margin:40px auto; padding:20px; background:var(--panel); border-radius:12px; font-size:14px; line-height:1.6; }
  .panel input { width:100%; padding:8px; font-size:13px; border:1px solid var(--line); border-radius:6px; font-family:inherit; margin:6px 0 10px; background:transparent; color:inherit; }
  .panel code { font-size:12px; background:rgba(127,127,127,.15); padding:1px 5px; border-radius:4px; }
  .msg { padding:10px 14px; font-size:13px; color:var(--mute); }
  .err { color:#d50000; }
  @media (max-width:600px) { :root { --hour:52px; --col:120px; --gutter:38px; } .dayhead b { font-size:15px; } header.top h1 { font-size:13px; } }
</style>
</head>
<body>
<header class="top">
  <h1 id="title">AliVEWEEK</h1>
  <div class="nav" id="nav"></div>
</header>
<div class="banner" id="banner" hidden></div>
<div class="sched" id="main"></div>

<script src="https://accounts.google.com/gsi/client" async defer onload="onGisReady()"></script>
<script>
/* AliVEWEEK 주간 스케줄러 — 정적(GitHub Pages)판.
   서버 없이 브라우저에서 구글에 직접 로그인해 읽기 전용으로 조회한다.
   비밀값 없음: OAuth 클라이언트 ID는 공개값이라 이 페이지에 저장해도 된다(localStorage).
   실시간: 현재시각 선은 30초, 일정은 5분마다 갱신. */
const CAL = { attoyd: "attoyd1004@gmail.com", hanyang: "rladkxh1004@hanyang.ac.kr" };
const CAL_LABEL = { [CAL.attoyd]: "attoyd", [CAL.hanyang]: "한양" };
const COLOR_META = {
  "1": { name: "이동", hex: "#7986cb" }, "2": { name: "약속·모임", hex: "#33b679" },
  "3": { name: "창업·대외", hex: "#8e24aa" }, "4": { name: "운선", hex: "#e67c73" },
  "5": { name: "미분류", hex: "#f6bf26" }, "6": { name: "노동·근무", hex: "#f4511e" },
  "7": { name: "공부", hex: "#039be5" }, "8": { name: "돈", hex: "#616161" },
  "9": { name: "수업·학사", hex: "#3f51b5" }, "10": { name: "건강·몸", hex: "#0b8043" },
  "11": { name: "시험·마감", hex: "#d50000" },
};
const WEEK1_START = "2026-08-30"; // 1주차 시작(일) — 학사 캘린더 "N주차" 마커와 동일
const DOW = ["일", "월", "화", "수", "목", "금", "토"];
const SCOPE = "https://www.googleapis.com/auth/calendar"; // 읽기·쓰기 + 장소 레이어 캘린더 생성
const PLACE_CAL_NAME = "장소 레이어"; // 별도 보조 캘린더 — attoyd/한양을 더럽히지 않는다
const BYDAY = ["SU", "MO", "TU", "WE", "TH", "FR", "SA"];
const REFRESH_MS = 5 * 60e3;
const MIN_VIS = 30; // 블록 최소 높이(분) — 10분 이동도 제목이 보이게

const toDateStr = (d) => d.toISOString().slice(0, 10);
const kstNow = () => new Date(Date.now() + 9 * 3600e3);          // UTC getter로 읽으면 KST
const kstToday = () => toDateStr(kstNow());
const kstNowMin = () => { const d = kstNow(); return d.getUTCHours() * 60 + d.getUTCMinutes(); };
const addDays = (s, n) => { const d = new Date(s + "T00:00:00Z"); d.setUTCDate(d.getUTCDate() + n); return toDateStr(d); };
const sundayOf = (s) => { const d = new Date(s + "T00:00:00Z"); d.setUTCDate(d.getUTCDate() - d.getUTCDay()); return toDateStr(d); };
const weekNo = (sun) => Math.round((new Date(sun + "T00:00:00Z") - new Date(WEEK1_START + "T00:00:00Z")) / 864e5 / 7) + 1;
const mmdd = (s) => s.slice(5).replace("-", "/");
const hm = (min) => `${String(Math.floor(min / 60)).padStart(2, "0")}:${String(min % 60).padStart(2, "0")}`;
const esc = (s) => String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
const $ = (id) => document.getElementById(id);

let clientId = null;
try { clientId = new URLSearchParams(location.search).get("client_id") || localStorage.getItem("aw.clientId"); } catch {}
if (clientId) { try { localStorage.setItem("aw.clientId", clientId); } catch {} }

const params = new URLSearchParams(location.search);
const sunday = sundayOf(/^\d{4}-\d{2}-\d{2}$/.test(params.get("start") || "") ? params.get("start") : kstToday());
const days = Array.from({ length: 7 }, (_, i) => addDays(sunday, i));

function renderHeader() {
  $("title").innerHTML = `AliVEWEEK · ${weekNo(sunday)}주차 <small>${mmdd(sunday)}–${mmdd(addDays(sunday, 6))}</small>`;
  $("nav").innerHTML = `<a href="?start=${addDays(sunday, -7)}">←</a><a href="?">이번주</a><a href="?start=${addDays(sunday, 7)}">→</a><button class="btn${placesOn ? " on" : ""}" id="placeToggle" onclick="togglePlaces()" title="장소 레이어 표시">장소</button><button class="btn" onclick="openPlaceForm()" title="장소 시간표 추가">＋장소</button><button class="btn primary" onclick="openForm()" title="일정 추가">＋일정</button>`;
}
function banner(html) { const b = $("banner"); if (!html) { b.hidden = true; return; } b.innerHTML = html; b.hidden = false; }

function setupPanel(msg) {
  $("main").innerHTML = `<div class="panel">
    ${msg ? `<p class="err">${esc(msg)}</p>` : ""}
    <p><b>처음 1회 설정</b> — 구글 OAuth 클라이언트 ID를 넣어줘. (공개값이라 여기 저장해도 안전)</p>
    <p style="font-size:12px;color:var(--mute)">console.cloud.google.com → API 및 서비스 → 사용자 인증 정보 → OAuth 클라이언트 ID → <b>웹 애플리케이션</b> → 승인된 자바스크립트 원본에 <code>${esc(location.origin)}</code> 추가</p>
    <input id="cid" placeholder="xxxx.apps.googleusercontent.com" value="${esc(clientId || "")}">
    <button class="btn primary" onclick="saveClientId()">저장하고 로그인</button>
  </div>`;
}
function saveClientId() {
  const v = $("cid").value.trim();
  if (!v) return;
  clientId = v;
  try { localStorage.setItem("aw.clientId", v); } catch {}
  login(true);
}

function savedToken() {
  try { const t = JSON.parse(sessionStorage.getItem("aw.tok") || "null"); if (t && t.scope === SCOPE && Date.now() < t.exp - 60e3) return t.token; } catch {}
  return null;
}
function loginPanel() {
  if (hasGrid) { banner(`로그인이 만료됐어. <button class="btn primary" onclick="login(true)">다시 로그인</button>`); return; }
  $("main").innerHTML = `<div class="panel">
    <p>구글 로그인이 필요해 — <b>한양 계정(rladkxh1004@hanyang.ac.kr)</b>으로. attoyd 캘린더도 그 계정 권한으로 같이 읽어.</p>
    <button class="btn primary" onclick="login(true)">구글로 로그인</button>
    <button class="btn" onclick="setupPanel()">클라이언트 ID 바꾸기</button>
  </div>`;
}
function login(interactive) {
  if (!window.google || !google.accounts) { setTimeout(() => login(interactive), 300); return; }
  const tc = google.accounts.oauth2.initTokenClient({
    client_id: clientId, scope: SCOPE,
    callback: (r) => {
      if (r.error) { loginPanel(); return; }
      try { sessionStorage.setItem("aw.tok", JSON.stringify({ token: r.access_token, exp: Date.now() + r.expires_in * 1000, scope: SCOPE })); } catch {}
      banner(null);
      loadWeek(r.access_token, hasGrid);
    },
    error_callback: () => loginPanel(),
  });
  tc.requestAccessToken({ prompt: interactive ? "" : "none" });
}

async function fetchEvents(token, calId, timeMin, timeMax) {
  const q = new URLSearchParams({ maxResults: "250", singleEvents: "true", showDeleted: "false", orderBy: "startTime", timeMin, timeMax, timeZone: "Asia/Seoul" });
  const r = await fetch(`https://www.googleapis.com/calendar/v3/calendars/${encodeURIComponent(calId)}/events?${q}`, { headers: { Authorization: "Bearer " + token } });
  if (r.status === 401 || r.status === 403) { try { sessionStorage.removeItem("aw.tok"); } catch {} throw new Error("auth"); }
  if (!r.ok) throw new Error(await r.text());
  return (await r.json()).items || [];
}

/* 겹치는 일정끼리 열을 나눠 나란히 배치 (구글 캘린더식) */
function layout(items) {
  items.sort((a, b) => a.s - b.s || b.e - a.e);
  let cluster = [], clusterEnd = -1;
  const flush = () => {
    const colsEnd = [];
    for (const it of cluster) {
      let c = colsEnd.findIndex((end) => end <= it.s);
      if (c < 0) { c = colsEnd.length; colsEnd.push(0); }
      colsEnd[c] = it.e; it.col = c;
    }
    for (const it of cluster) it.cols = colsEnd.length;
    cluster = [];
  };
  for (const it of items) {
    if (cluster.length && it.s >= clusterEnd) flush();
    cluster.push(it); clusterEnd = Math.max(clusterEnd, it.e);
  }
  if (cluster.length) flush();
  // 최소 높이(ve)가 다음 블록 머리를 덮으면 그만큼 다음 블록 내용을 아래로
  for (const it of items) {
    it.padTop = 0;
    for (const p of items) if (p !== it && p.col === it.col && p.e <= it.s && p.ve > it.s) it.padTop = Math.max(it.padTop, p.ve - it.s);
  }
}

let hasGrid = false, timed = {}, allday = {}, placeBuckets = {};
let placesOn = true; try { placesOn = localStorage.getItem("aw.placesOn") !== "0"; } catch {}
let placeCalChecked = false, placeCalId = null; try { placeCalId = localStorage.getItem("aw.placeCal"); } catch {}
const placeMasters = {}; // masterId → { recurrence, summary, ... }
function togglePlaces() {
  placesOn = !placesOn; try { localStorage.setItem("aw.placesOn", placesOn ? "1" : "0"); } catch {}
  $("placeToggle").classList.toggle("on", placesOn);
  const tok = savedToken(); if (tok) loadWeek(tok, true);
}
/* 장소 레이어 캘린더 찾기(없으면 create=true일 때만 생성) */
async function ensurePlaceCal(tok, create) {
  if (placeCalId) return placeCalId;
  if (placeCalChecked && !create) return null;
  const list = await gcal(tok, "/users/me/calendarList?minAccessRole=writer&maxResults=250", "GET");
  placeCalChecked = true;
  const hit = (list.items || []).find((c) => c.summary === PLACE_CAL_NAME);
  let id = hit ? hit.id : null;
  if (!id && create) { const made = await gcal(tok, "/calendars", "POST", { summary: PLACE_CAL_NAME, timeZone: "Asia/Seoul", description: "AliVEWEEK 장소 레이어 — 특정 장소의 운영·이용 가능 시간표" }); id = made.id; }
  if (id) { placeCalId = id; try { localStorage.setItem("aw.placeCal", id); } catch {} }
  return id;
}
const bydayText = (rr) => { const m = /BYDAY=([A-Z,]+)/.exec(rr || ""); return m ? m[1].split(",").map((c) => DOW[BYDAY.indexOf(c)]).join("") : "매일"; };

function evHtml(it, d, today, nowMin) {
  const hex = (COLOR_META[it.color] || {}).hex || "#9aa0a6";
  const dur = it.e - it.s;
  const state = d < today || (d === today && it.e <= nowMin) ? " past" : d === today && it.s <= nowMin && nowMin < it.e ? " live" : "";
  const w = 100 / it.cols, left = it.col * w;
  const shortCls = dur < 45 ? " short" : "";
  const k = reg(it);

function buildBody(f) {

  else {
    let st = f.start.value, et = f.end.value;
    if (!st || !et) return null;

    if (et === "23:59") { et = "00:00"; endDate = addDays(date, 1); }
    else if (et <= st) endDate = addDays(date, 1); // 자정 넘김 (예: 20:00–00:00)
    body.start = { dateTime: `${date}T${st}:00+09:00`, timeZone: "Asia/Seoul" };

async function gcal(tok, path, method, body) {
  const r = await fetch(path.startsWith("/") ? `https://www.googleapis.com/calendar/v3${path}` : `https://www.googleapis.com/calendar/v3/calendars/${path}`, {
    method, headers: { Authorization: "Bearer " + tok, ...(body ? { "Content-Type": "application/json" } : {}) }, body: body ? JSON.stringify(body) : undefined,
  });
  if (r.status === 401 || r.status === 403) { try { sessionStorage.removeItem("aw.tok"); } catch {} throw new Error("auth"); }
  if (!r.ok && r.status !== 410) throw new Error((await r.text()).slice(0, 200)); // 410 = 이미 삭제됨
  return r.status === 204 || r.status === 410 ? null : r.json();
}

  </div>`);
}

/* 현재시각 선 — 30초마다 위치만 갱신, 지난 일정은 흐리게·진행 중은 강조 */
function tick() {
  if (!hasGrid) return;
  document.querySelectorAll(".nowline,.nowtag").forEach((n) => n.remove());
  const today = kstToday(), nowMin = kstNowMin();
  const col = document.querySelector(`.daycol[data-d="${today}"]`);
  if (!col) return;
  const pct = (nowMin / 1440) * 100;
  col.insertAdjacentHTML("beforeend", `<div class="nowline" style="top:${pct}%"></div>`);
  document.querySelector(".gutter").insertAdjacentHTML("beforeend", `<div class="nowtag" style="top:${pct}%">${hm(nowMin)}</div>`);
  col.querySelectorAll(".ev").forEach((el, i) => {
    const it = timed[today][i]; if (!it) return;
    el.classList.toggle("past", it.e <= nowMin);
    el.classList.toggle("live", it.s <= nowMin && nowMin < it.e);
  });
}
setInterval(tick, 30e3);

function scrollToNow(first) {
  const sched = $("main"), today = kstToday();
  const hourPx = parseFloat(getComputedStyle(document.documentElement).getPropertyValue("--hour"));
  const target = days.includes(today) ? Math.max(0, (kstNowMin() / 60 - 1.5) * hourPx) : 8 * hourPx;
  sched.scrollTop = target;
  if (first && days.includes(today)) { const c = document.querySelector(".daycol.today"); if (c) c.scrollIntoView({ inline: "center", block: "nearest" }); }
}

async function loadWeek(token, quiet) {
  if (!quiet) $("main").innerHTML = `<p class="msg">불러오는 중…</p>`;
  const t = Object.fromEntries(days.map((d) => [d, []])), a = Object.fromEntries(days.map((d) => [d, []]));
  const timeMin = `${sunday}T00:00:00+09:00`, timeMax = `${addDays(sunday, 7)}T00:00:00+09:00`;
  try {
    const lists = await Promise.all([CAL.attoyd, CAL.hanyang].map((c) => fetchEvents(token, c, timeMin, timeMax).then((evs) => [c, evs])));
    for (const [calId, evs] of lists) {
      for (const ev of evs) {
        if (ev.status === "cancelled") continue;
        const base = { title: ev.summary || "(제목 없음)", loc: ev.location, color: ev.colorId || "0", cal: CAL_LABEL[calId] || calId,
          desc: ev.description || "", link: ev.htmlLink || "", meet: ev.hangoutLink || "", recurring: !!ev.recurringEventId,
          id: ev.id, calId, masterId: ev.recurringEventId || "",
          startRaw: (ev.start && (ev.start.dateTime || ev.start.date)) || "", endRaw: (ev.end && (ev.end.dateTime || ev.end.date)) || "" };
        if (ev.start && ev.start.dateTime) {
          const sd = ev.start.dateTime.slice(0, 10), sm = +ev.start.dateTime.slice(11, 13) * 60 + +ev.start.dateTime.slice(14, 16);
          const edt = (ev.end && ev.end.dateTime) || ev.start.dateTime;
          const ed = edt.slice(0, 10), em = +edt.slice(11, 13) * 60 + +edt.slice(14, 16);
          // 자정 넘는 일정은 날짜별 조각으로 (20–24시는 같은 날 24:00까지)
          for (let d = sd; d <= ed; d = addDays(d, 1)) {
            const s = d === sd ? sm : 0, e = d === ed ? em : 1440;
            if (e <= s) continue;
            if (t[d]) t[d].push({ ...base, s, e, ve: Math.min(1440, Math.max(e, s + MIN_VIS)) });
          }
        } else if (ev.start && ev.start.date) {
          let d = ev.start.date; const end = (ev.end && ev.end.date) || addDays(d, 1);
          while (d < end) { if (a[d]) a[d].push(base); d = addDays(d, 1); }
        }
      }
    }
  } catch (e) {
    if (String(e.message) === "auth") { loginPanel(); return; }
    if (quiet) { banner(`갱신 실패: ${esc(e.message).slice(0, 120)}`); return; }
    $("main").innerHTML = `<p class="msg err">불러오기 실패: ${esc(e.message)}</p>`; return;
  }
  // 장소 레이어: 보조 캘린더가 있으면 읽고, 반복 마스터(요일 규칙)도 캐시
  const pb = Object.fromEntries(days.map((d) => [d, []]));
  if (placesOn) {
    try {
      const pid = await ensurePlaceCal(token, false);
      if (pid) {
        for (const ev of await fetchEvents(token, pid, timeMin, timeMax)) {
          if (ev.status === "cancelled" || !ev.start || !ev.start.dateTime) continue;
          const sd = ev.start.dateTime.slice(0, 10), sm = +ev.start.dateTime.slice(11, 13) * 60 + +ev.start.dateTime.slice(14, 16);
          const edt = (ev.end && ev.end.dateTime) || ev.start.dateTime, ed = edt.slice(0, 10);
          let em = +edt.slice(11, 13) * 60 + +edt.slice(14, 16); if (ed > sd) em = 1440;
          if (pb[sd]) pb[sd].push({ place: true, title: ev.summary || "(장소)", loc: ev.location, desc: ev.description || "", cal: "장소", color: "0",
            s: sm, e: em, id: ev.id, calId: pid, masterId: ev.recurringEventId || ev.id, recurring: !!ev.recurringEventId, startRaw: ev.start.dateTime, endRaw: edt, link: ev.htmlLink || "" });
        }
        const masters = [...new Set(Object.values(pb).flat().map((x) => x.masterId))].filter((m) => !placeMasters[m]);
        await Promise.all(masters.map((m) => gcal(token, `${encodeURIComponent(pid)}/events/${encodeURIComponent(m)}`, "GET").then((ev) => (placeMasters[m] = ev)).catch(() => {})));
      }
    } catch (e) { if (String(e.message) === "auth") { loginPanel(); return; } banner(`장소 레이어 읽기 실패: ${esc(e.message).slice(0, 120)}`); }
  }
  placeBuckets = pb;
  for (const d of days) layout(t[d]);
  timed = t; allday = a;
  const keepScroll = hasGrid ? { top: $("main").scrollTop, left: $("main").scrollLeft } : null;
  renderGrid();
  if (keepScroll === null) scrollToNow(true); else { $("main").scrollTop = keepScroll.top; $("main").scrollLeft = keepScroll.left; }
  banner(null);
}

/* 5분마다 조용히 다시 읽기 — 토큰이 죽었으면 조용히 재로그인 시도 */
setInterval(() => {
  if (!clientId) return;
  const tok = savedToken();
  if (tok) loadWeek(tok, true); else login(false);
}, REFRESH_MS);
document.addEventListener("visibilitychange", () => { if (!document.hidden && hasGrid) { tick(); const tok = savedToken(); if (tok) loadWeek(tok, true); } });

function onGisReady() {
  if (!clientId) return;
  if (!savedToken()) login(false); // 조용히 시도 → 실패하면 로그인 버튼
}
renderHeader();
if (!clientId) setupPanel();
else { const t = savedToken(); if (t) loadWeek(t); else loginPanel(); }
</script>
